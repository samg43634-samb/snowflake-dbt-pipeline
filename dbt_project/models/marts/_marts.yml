version: 2

models:
  - name: dim_cust
    description: "Type-2 slowly changing customer dimension."
    columns:
      - name: customer_sk
        description: "Surrogate key: unique per customer per version."
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: customer_tier
        tests:
          - accepted_values:
              arguments:
                values: ['GOLD', 'SILVER', 'BRONZE']

  - name: dim_products
    description: "Type-2 slowly changing product dimension."
    columns:
      - name: product_sk
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]

  - name: fact_orders
    description: >
      One row per order line, at current customer/product dimension state.
      Incremental (merge on order_line_id): each run only reprocesses
      lines whose order or order-line updated_at is newer than what's
      already in the table.
    columns:
      - name: order_line_id
        tests: [unique, not_null]
      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_cust')
                field: customer_sk
      - name: product_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_sk
      - name: quantity
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: gross_margin_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1

  - name: cust_metrics
    description: >
      One row per customer: order count, lifetime spend, recency, spend
      quartile, and a customer_status label. Built with window functions
      (ROW_NUMBER, LAG, SUM OVER, NTILE) over fact_orders rather than a
      plain aggregation.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: spend_quartile
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: customer_status
        tests:
          - accepted_values:
              arguments:
                values: ['TOP SPENDER', 'AT RISK', 'ACTIVE']

  - name: product_performance
    description: >
      One row per product: revenue rank and ABC/Pareto classification
      from a cumulative-revenue-share window function, via the abc_class
      macro.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: revenue_rank
        tests: [unique, not_null]
      - name: abc_class
        tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C']
      - name: cumulative_revenue_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
