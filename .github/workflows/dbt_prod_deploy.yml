name: dbt Deploy (prod)

# Two triggers:
#   - push to main: deploys whatever code just got merged
#   - nightly schedule: refreshes prod with new data even on days with no
#     code changes at all (data changes every day; code doesn't)
# Also runnable by hand from the Actions tab (workflow_dispatch), for a
# one-off manual refresh without waiting for the schedule.
on:
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: dbt-deploy-prod
  cancel-in-progress: false  # never cancel a prod run mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # ties this job to a GitHub Environment with
                               # its own protection rules / required reviewers
    defaults:
      run:
        working-directory: dbt_project

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Install dbt packages (dbt_utils)
        run: dbt deps

      - name: Build and test everything against PROD
        run: dbt build --target prod

      - name: Regenerate docs
        run: dbt docs generate --target prod

    env:
      # GitHub Environment secrets scoped to "production" -- separate from
      # the PR-level CI secrets, and can require manual approval before a
      # deploy runs (Settings -> Environments -> production -> Required
      # reviewers).
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_PROD_USER: ${{ secrets.DBT_SNOWFLAKE_PROD_USER }}
      DBT_SNOWFLAKE_PROD_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PROD_PASSWORD }}
