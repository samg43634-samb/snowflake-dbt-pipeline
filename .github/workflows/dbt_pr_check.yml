name: dbt PR Check

on:
  pull_request:
    branches: [dev, test, main]
    paths:
      - 'dbt_project/**'

concurrency:
  group: dbt-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-into-dev:
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: dbt_project
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/snowflake_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write private key to file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /home/runner/snowflake_key.p8
          chmod 600 /home/runner/snowflake_key.p8
      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.sample ~/.dbt/profiles.yml
      - run: pip install dbt-snowflake
      - run: dbt deps
      - run: dbt debug --target dev
      - run: dbt build --target dev

  check-into-test:
    if: github.base_ref == 'test'
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: dbt_project
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/snowflake_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write private key to file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /home/runner/snowflake_key.p8
          chmod 600 /home/runner/snowflake_key.p8
      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.sample ~/.dbt/profiles.yml
      - run: pip install dbt-snowflake
      - run: dbt deps
      - run: dbt debug --target test
      - run: dbt build --target test
      - run: dbt source freshness --target test
        continue-on-error: true

  check-into-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: dbt_project
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/snowflake_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write private key to file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /home/runner/snowflake_key.p8
          chmod 600 /home/runner/snowflake_key.p8
      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.sample ~/.dbt/profiles.yml
      - run: pip install dbt-snowflake
      - run: dbt deps
      - run: dbt build --target test
