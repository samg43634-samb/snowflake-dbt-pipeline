name: Deploy Snowflake DDL/DML

on:
  push:
    branches: [dev, test, main]
    paths:
      - 'snowflake/deploy_manifest.txt'
      - 'snowflake/seed_manifest.txt'
      - 'snowflake/01_schemas_and_grants.sql'
      - 'snowflake/raw_sm/tables/**'
      - 'snowflake/raw_sm/seed_data/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy against'
        required: true
        type: choice
        options: [dev, test, prod]

concurrency:
  group: snowflake-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: >
      github.ref == 'refs/heads/dev' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_DATABASE: ANALYTICS_DB_DEV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install snowflake-connector-python cryptography

      - name: Deploy schemas and tables (deploy_manifest.txt)
        run: |
          while IFS= read -r f; do
            [[ -z "$f" || "$f" == \#* ]] && continue
            python scripts/deploy_snowflake_sql.py "$f"
          done < snowflake/deploy_manifest.txt

      - name: Deploy seed data (seed_manifest.txt)
        run: |
          while IFS= read -r f; do
            [[ -z "$f" || "$f" == \#* ]] && continue
            python scripts/deploy_snowflake_sql.py "$f"
          done < snowflake/seed_manifest.txt

  deploy-test:
    if: >
      github.ref == 'refs/heads/test' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'test')
    runs-on: ubuntu-latest
    environment: test
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_DATABASE: ANALYTICS_DB_TEST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install snowflake-connector-python cryptography

      - name: Deploy schemas and tables (deploy_manifest.txt)
        run: |
          while IFS= read -r f; do
            [[ -z "$f" || "$f" == \#* ]] && continue
            python scripts/deploy_snowflake_sql.py "$f"
          done < snowflake/deploy_manifest.txt

      - name: Deploy seed data (seed_manifest.txt)
        run: |
          while IFS= read -r f; do
            [[ -z "$f" || "$f" == \#* ]] && continue
            python scripts/deploy_snowflake_sql.py "$f"
          done < snowflake/seed_manifest.txt

  deploy-prod:
    if: >
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    environment: production
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_DATABASE: ANALYTICS_DB_PROD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install snowflake-connector-python cryptography

      - name: Deploy schemas and tables (deploy_manifest.txt)
        run: |
          while IFS= read -r f; do
            [[ -z "$f" || "$f" == \#* ]] && continue
            python scripts/deploy_snowflake_sql.py "$f"
          done < snowflake/deploy_manifest.txt

      - name: Deploy seed data (seed_manifest.txt)
        run: |
          while IFS= read -r f; do
            [[ -z "$f" || "$f" == \#* ]] && continue
            python scripts/deploy_snowflake_sql.py "$f"
          done < snowflake/seed_manifest.txt
