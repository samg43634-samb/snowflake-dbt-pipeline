name: dbt Deploy

on:
  push:
    branches: [dev, test, main]
    paths:
      - 'dbt_project/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy manually'
        required: true
        type: choice
        options: [dev, test, prod]

concurrency:
  group: dbt-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: >
      github.ref == 'refs/heads/dev' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: dbt_project
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/snowflake_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write private key to file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /home/runner/snowflake_key.p8
          chmod 600 /home/runner/snowflake_key.p8
      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.sample ~/.dbt/profiles.yml
      - run: pip install dbt-snowflake
      - run: dbt deps
      - run: dbt build --target dev

  deploy-test:
    if: >
      github.ref == 'refs/heads/test' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'test')
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: dbt_project
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/snowflake_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write private key to file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /home/runner/snowflake_key.p8
          chmod 600 /home/runner/snowflake_key.p8
      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.sample ~/.dbt/profiles.yml
      - run: pip install dbt-snowflake
      - run: dbt deps
      - run: dbt build --target test

  deploy-prod:
    if: >
      github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: dbt_project
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/snowflake_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write private key to file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /home/runner/snowflake_key.p8
          chmod 600 /home/runner/snowflake_key.p8
      - name: Set up dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.sample ~/.dbt/profiles.yml
      - run: pip install dbt-snowflake
      - run: dbt deps
      - run: dbt build --target prod
      - run: dbt docs generate --target prod
