name: dbt CI (pull request)

# Runs on every PR that touches the dbt project. This is the gate: a PR
# can't be merged until this passes (configure that as a required status
# check under Settings -> Branches -> Branch protection rules for `main`).
on:
  pull_request:
    branches: [main]
    paths:
      - 'dbt_project/**'
      - '.github/workflows/dbt_ci.yml'

# Only one CI run per PR at a time; a new push cancels the previous run
# instead of queuing behind it.
concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project

    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Install dbt packages (dbt_utils)
        run: dbt deps

      - name: Confirm the TEST connection works
        run: dbt debug --target test

      - name: Build and test everything (seed -> snapshot -> run -> test)
        run: dbt build --target test

      - name: Check source freshness
        run: dbt source freshness --target test
        continue-on-error: true # freshness is informational; don't fail the PR on it

    env:
      # These are GitHub repository secrets (Settings -> Secrets and
      # variables -> Actions), never hardcoded here. See profiles.yml.sample
      # for how each one is consumed by dbt's `test` target.
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_CI_USER: ${{ secrets.DBT_SNOWFLAKE_CI_USER }}
      DBT_SNOWFLAKE_CI_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_CI_PASSWORD }}
